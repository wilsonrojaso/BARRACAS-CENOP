<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Horario Semanal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #0a0a2e;
            color: white;
            min-height: 100vh;
            overflow-x: hidden;
            padding-bottom: 80px;
        }

        .header {
            background: linear-gradient(135deg, #1a1a4e 0%, #2d2d7e 100%);
            padding: 15px 20px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .header h1 {
            font-size: 1.5rem;
            margin-bottom: 5px;
        }

        .week-selector {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-top: 8px;
        }

        .week-selector button {
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            font-size: 1.2rem;
            cursor: pointer;
        }

        .week-selector span {
            font-size: 1rem;
            min-width: 200px;
        }

        .tab-container {
            display: flex;
            background: #1a1a4e;
            position: sticky;
            top: 80px;
            z-index: 99;
        }

        .tab {
            flex: 1;
            padding: 12px 5px;
            text-align: center;
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.3s;
            border-bottom: 3px solid transparent;
        }

        .tab.active {
            background: rgba(255,255,255,0.1);
            border-bottom-color: #00d4ff;
            color: #00d4ff;
        }

        .schedule-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 10px;
        }

        .day-section {
            display: none;
        }

        .day-section.active {
            display: block;
        }

        .time-slot-group {
            margin-bottom: 8px;
        }

        .time-label {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            font-size: 0.85rem;
            color: #888;
        }

        .time-label::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #333;
        }

        .wings-container {
            display: flex;
            gap: 8px;
            padding: 0 5px;
        }

        .wing-column {
            flex: 1;
        }

        .wing-header {
            text-align: center;
            padding: 5px;
            font-size: 0.75rem;
            font-weight: bold;
            border-radius: 8px 8px 0 0;
            margin-bottom: 2px;
        }

        .wing-a-header { background: linear-gradient(135deg, #2196F3, #1565C0); }
        .wing-b-header { background: linear-gradient(135deg, #FF9800, #E65100); }

        .course-card {
            border-radius: 10px;
            padding: 10px;
            margin-bottom: 4px;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
            user-select: none;
            min-height: 60px;
        }

        .course-card:active {
            transform: scale(0.97);
        }

        .course-card.wing-a {
            background: linear-gradient(135deg, #1a3a5c, #1e4d7a);
            border-left: 4px solid #2196F3;
        }

        .course-card.wing-b {
            background: linear-gradient(135deg, #4a2800, #5c3a00);
            border-left: 4px solid #FF9800;
        }

        .course-name {
            font-weight: bold;
            font-size: 0.9rem;
            margin-bottom: 2px;
        }

        .course-teacher {
            font-size: 0.75rem;
            opacity: 0.8;
        }

        .course-room {
            font-size: 0.7rem;
            opacity: 0.6;
        }

        .empty-slot {
            border: 2px dashed #333;
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            color: #555;
            cursor: pointer;
            font-size: 0.8rem;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .empty-slot:hover {
            border-color: #00d4ff;
            color: #00d4ff;
        }

        /* EXPANDED PANEL OVERLAY */
        .expanded-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 500;
            justify-content: center;
            align-items: center;
            animation: fadeIn 0.2s ease;
        }

        .expanded-overlay.show {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .expanded-panel {
            width: 94%;
            max-width: 500px;
            min-height: 50vh;
            max-height: 85vh;
            border-radius: 20px;
            padding: 25px 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            animation: slideUp 0.3s ease;
            overflow-y: auto;
            position: relative;
        }

        .expanded-panel.wing-a {
            background: linear-gradient(145deg, #0d2948, #1a4a7a, #0d2948);
            border: 2px solid #2196F3;
            box-shadow: 0 0 40px rgba(33, 150, 243, 0.3);
        }

        .expanded-panel.wing-b {
            background: linear-gradient(145deg, #3d1f00, #5c3a00, #3d1f00);
            border: 2px solid #FF9800;
            box-shadow: 0 0 40px rgba(255, 152, 0, 0.3);
        }

        @keyframes slideUp {
            from { transform: translateY(50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .expanded-close {
            position: absolute;
            top: 12px;
            right: 15px;
            background: rgba(255,255,255,0.15);
            border: none;
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 1.3rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .expanded-title {
            font-size: 1.6rem;
            font-weight: bold;
            padding-right: 40px;
        }

        .expanded-details {
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex: 1;
        }

        .detail-row {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            background: rgba(255,255,255,0.08);
            border-radius: 12px;
            font-size: 1rem;
        }

        .detail-row .icon {
            font-size: 1.3rem;
            width: 30px;
            text-align: center;
        }

        .detail-row .label {
            color: #aaa;
            font-size: 0.8rem;
            min-width: 70px;
        }

        .detail-row .value {
            font-weight: 600;
            flex: 1;
        }

        .expanded-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 10px;
        }

        .action-btn {
            padding: 18px 15px;
            border: none;
            border-radius: 16px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.2s;
            color: white;
            min-height: 65px;
        }

        .action-btn:active {
            transform: scale(0.95);
        }

        .action-btn .btn-icon {
            font-size: 1.5rem;
        }

        .btn-edit {
            background: linear-gradient(135deg, #4CAF50, #2E7D32);
        }

        .btn-move {
            background: linear-gradient(135deg, #2196F3, #1565C0);
        }

        .btn-delete {
            background: linear-gradient(135deg, #f44336, #c62828);
        }

        .btn-call {
            background: linear-gradient(135deg, #9C27B0, #6A1B9A);
        }

        /* FAB */
        .fab-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 200;
        }

        .fab-main {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00d4ff, #0088cc);
            border: none;
            color: white;
            font-size: 1.8rem;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,212,255,0.4);
            transition: transform 0.3s;
        }

        .fab-main.active {
            transform: rotate(45deg);
        }

        .fab-menu {
            position: absolute;
            bottom: 70px;
            right: 0;
            display: none;
            flex-direction: column;
            gap: 10px;
        }

        .fab-menu.show {
            display: flex;
        }

        .fab-item {
            display: flex;
            align-items: center;
            gap: 10px;
            white-space: nowrap;
        }

        .fab-item-label {
            background: white;
            color: #333;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 500;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }

        .fab-item-btn {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: none;
            color: white;
            font-size: 1.3rem;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }

        /* MODAL */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            justify-content: center;
            align-items: flex-start;
            padding: 20px;
            overflow-y: auto;
        }

        .modal-overlay.show {
            display: flex;
        }

        .modal {
            background: #1a1a4e;
            border-radius: 20px;
            padding: 25px;
            width: 100%;
            max-width: 500px;
            margin-top: 30px;
        }

        .modal h2 {
            margin-bottom: 20px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.9rem;
            color: #aaa;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 2px solid #333;
            background: #0a0a2e;
            color: white;
            font-size: 1rem;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: #00d4ff;
            outline: none;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .form-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .form-actions button {
            flex: 1;
            padding: 14px;
            border-radius: 12px;
            border: none;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-save {
            background: linear-gradient(135deg, #00d4ff, #0088cc);
            color: white;
        }

        .btn-cancel {
            background: #333;
            color: white;
        }

        /* MOVE MODAL */
        .move-modal .move-options {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 50vh;
            overflow-y: auto;
        }

        .move-option {
            padding: 14px;
            background: rgba(255,255,255,0.08);
            border: 2px solid transparent;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            color: white;
            text-align: left;
            font-size: 0.95rem;
        }

        .move-option:hover, .move-option.selected {
            border-color: #00d4ff;
            background: rgba(0, 212, 255, 0.1);
        }

        .move-option .move-day {
            font-weight: bold;
        }

        .move-option .move-time {
            font-size: 0.8rem;
            color: #aaa;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #333;
            color: white;
            padding: 12px 24px;
            border-radius: 25px;
            font-size: 0.9rem;
            z-index: 2000;
            transition: transform 0.3s;
            white-space: nowrap;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
        }

        /* Status indicator */
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
        }

        .status-active { background: #4CAF50; }
        .status-inactive { background: #f44336; }

        .wing-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 0.7rem;
            font-weight: bold;
            margin-left: 5px;
        }

        .wing-a .wing-badge { background: rgba(33,150,243,0.3); }
        .wing-b .wing-badge { background: rgba(255,152,0,0.3); }

        .no-courses {
            text-align: center;
            padding: 40px 20px;
            color: #555;
        }

        .no-courses .emoji {
            font-size: 3rem;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>📅 Mi Horario</h1>
        <div class="week-selector">
            <button onclick="changeWeek(-1)">◀</button>
            <span id="weekRange"></span>
            <button onclick="changeWeek(1)">▶</button>
        </div>
    </div>

    <div class="tab-container" id="tabContainer"></div>
    <div class="schedule-container" id="scheduleContainer"></div>

    <!-- EXPANDED OVERLAY -->
    <div class="expanded-overlay" id="expandedOverlay" onclick="handleOverlayClick(event)">
        <div class="expanded-panel" id="expandedPanel" onclick="event.stopPropagation()">
            <button class="expanded-close" onclick="collapseCard()">✕</button>
            <div class="expanded-title" id="expTitle"></div>
            <div class="expanded-details" id="expDetails"></div>
            <div class="expanded-actions" id="expActions"></div>
        </div>
    </div>

    <div class="fab-container">
        <div class="fab-menu" id="fabMenu">
            <div class="fab-item">
                <span class="fab-item-label">Agregar Curso</span>
                <button class="fab-item-btn" style="background: #4CAF50;" onclick="openAddModal()">📚</button>
            </div>
            <div class="fab-item">
                <span class="fab-item-label">Exportar</span>
                <button class="fab-item-btn" style="background: #FF9800;" onclick="exportData()">📤</button>
            </div>
            <div class="fab-item">
                <span class="fab-item-label">Importar</span>
                <button class="fab-item-btn" style="background: #2196F3;" onclick="importData()">📥</button>
            </div>
        </div>
        <button class="fab-main" id="fabMain" onclick="toggleFab()">+</button>
    </div>

    <div class="modal-overlay" id="courseModal">
        <div class="modal">
            <h2 id="modalTitle">Agregar Curso</h2>
            <div class="form-group">
                <label>Nombre del curso *</label>
                <input type="text" id="courseName" placeholder="Ej: Matemáticas I">
            </div>
            <div class="form-group">
                <label>Profesor</label>
                <input type="text" id="courseTeacher" placeholder="Ej: Prof. García">
            </div>
            <div class="form-group">
                <label>Teléfono del profesor</label>
                <input type="tel" id="coursePhone" placeholder="Ej: 999888777">
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Día *</label>
                    <select id="courseDay">
                        <option value="lunes">Lunes</option>
                        <option value="martes">Martes</option>
                        <option value="miercoles">Miércoles</option>
                        <option value="jueves">Jueves</option>
                        <option value="viernes">Viernes</option>
                        <option value="sabado">Sábado</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Ala *</label>
                    <select id="courseWing">
                        <option value="A">Ala A</option>
                        <option value="B">Ala B</option>
                    </select>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Hora inicio *</label>
                    <input type="time" id="courseStart" value="07:00">
                </div>
                <div class="form-group">
                    <label>Hora fin *</label>
                    <input type="time" id="courseEnd" value="08:30">
                </div>
            </div>
            <div class="form-group">
                <label>Aula</label>
                <input type="text" id="courseRoom" placeholder="Ej: Aula 301">
            </div>
            <div class="form-group">
                <label>Notas</label>
                <textarea id="courseNotes" rows="2" placeholder="Notas adicionales..."></textarea>
            </div>
            <div class="form-actions">
                <button class="btn-cancel" onclick="closeModal()">Cancelar</button>
                <button class="btn-save" onclick="saveCourse()">Guardar</button>
            </div>
        </div>
    </div>

    <!-- MOVE MODAL -->
    <div class="modal-overlay" id="moveModal">
        <div class="modal move-modal">
            <h2>↕️ Mover Curso</h2>
            <p style="text-align:center; color:#aaa; margin-bottom:15px;" id="moveCourseName"></p>
            <div class="form-row" style="margin-bottom:15px;">
                <div class="form-group">
                    <label>Nuevo Día</label>
                    <select id="moveDay">
                        <option value="lunes">Lunes</option>
                        <option value="martes">Martes</option>
                        <option value="miercoles">Miércoles</option>
                        <option value="jueves">Jueves</option>
                        <option value="viernes">Viernes</option>
                        <option value="sabado">Sábado</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Nueva Ala</label>
                    <select id="moveWing">
                        <option value="A">Ala A</option>
                        <option value="B">Ala B</option>
                    </select>
                </div>
            </div>
            <div class="form-row" style="margin-bottom:15px;">
                <div class="form-group">
                    <label>Nueva Hora Inicio</label>
                    <input type="time" id="moveStart">
                </div>
                <div class="form-group">
                    <label>Nueva Hora Fin</label>
                    <input type="time" id="moveEnd">
                </div>
            </div>
            <div class="form-actions">
                <button class="btn-cancel" onclick="closeMoveModal()">Cancelar</button>
                <button class="btn-save" onclick="confirmMove()">Mover</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>
    <input type="file" id="fileInput" accept=".json" style="display:none" onchange="handleImport(event)">

    <script>
        let courses = JSON.parse(localStorage.getItem('courses') || '[]');
        let currentDay = '';
        let currentWeekOffset = 0;
        let editingCourseId = null;
        let movingCourseId = null;
        let expandedCourseId = null;

        const days = ['lunes', 'martes', 'miercoles', 'jueves', 'viernes', 'sabado'];
        const dayNames = {
            'lunes': 'Lunes', 'martes': 'Martes', 'miercoles': 'Miércoles',
            'jueves': 'Jueves', 'viernes': 'Viernes', 'sabado': 'Sábado'
        };
        const dayNumbers = {
            'lunes': 1, 'martes': 2, 'miercoles': 3, 'jueves': 4, 'viernes': 5, 'sabado': 6
        };

        const timeSlots = [
            '07:00', '07:30', '08:00', '08:30', '09:00', '09:30',
            '10:00', '10:30', '11:00', '11:30', '12:00', '12:30',
            '13:00', '13:30', '14:00', '14:30', '15:00', '15:30',
            '16:00', '16:30', '17:00', '17:30', '18:00', '18:30',
            '19:00', '19:30', '20:00', '20:30', '21:00'
        ];

        function init() {
            const today = new Date().getDay();
            const dayMap = { 0: 'lunes', 1: 'lunes', 2: 'martes', 3: 'miercoles', 4: 'jueves', 5: 'viernes', 6: 'sabado' };
            currentDay = dayMap[today];
            updateWeekRange();
            renderTabs();
            renderSchedule();
        }

        function getWeekDates() {
            const now = new Date();
            now.setDate(now.getDate() + (currentWeekOffset * 7));
            const monday = new Date(now);
            monday.setDate(now.getDate() - (now.getDay() || 7) + 1);
            const saturday = new Date(monday);
            saturday.setDate(monday.getDate() + 5);
            return { monday, saturday };
        }

        function updateWeekRange() {
            const { monday, saturday } = getWeekDates();
            const opts = { day: 'numeric', month: 'short' };
            document.getElementById('weekRange').textContent =
                `${monday.toLocaleDateString('es', opts)} - ${saturday.toLocaleDateString('es', opts)}, ${saturday.getFullYear()}`;
        }

        function changeWeek(dir) {
            currentWeekOffset += dir;
            updateWeekRange();
        }

        function renderTabs() {
            const container = document.getElementById('tabContainer');
            container.innerHTML = '';
            const dayAbbr = { 'lunes': 'LUN', 'martes': 'MAR', 'miercoles': 'MIÉ', 'jueves': 'JUE', 'viernes': 'VIE', 'sabado': 'SÁB' };
            days.forEach(day => {
                const tab = document.createElement('div');
                tab.className = `tab ${day === currentDay ? 'active' : ''}`;
                const count = courses.filter(c => c.day === day).length;
                tab.innerHTML = `${dayAbbr[day]}<br><small style="opacity:0.6">${count}</small>`;
                tab.onclick = () => {
                    currentDay = day;
                    collapseCard();
                    renderTabs();
                    renderSchedule();
                };
                container.appendChild(tab);
            });
        }

        function renderSchedule() {
            const container = document.getElementById('scheduleContainer');
            const dayCourses = courses.filter(c => c.day === currentDay);

            if (dayCourses.length === 0) {
                container.innerHTML = `
                    <div class="no-courses">
                        <div class="emoji">📭</div>
                        <p>No hay cursos para ${dayNames[currentDay]}</p>
                        <p style="font-size:0.8rem; margin-top:8px;">Toca + para agregar uno</p>
                    </div>`;
                return;
            }

            const usedSlots = new Set();
            const slotCourses = {};

            dayCourses.forEach(course => {
                const startIdx = timeSlots.indexOf(course.startTime);
                if (startIdx === -1) return;
                const key = course.startTime;
                if (!slotCourses[key]) slotCourses[key] = { A: [], B: [] };
                slotCourses[key][course.wing].push(course);
                usedSlots.add(key);
            });

            const sortedSlots = Array.from(usedSlots).sort();
            let html = '';

            sortedSlots.forEach(slot => {
                const data = slotCourses[slot];
                html += `<div class="time-slot-group">`;
                html += `<div class="time-label">${slot}</div>`;
                html += `<div class="wings-container">`;

                // Wing A
                html += `<div class="wing-column">`;
                html += `<div class="wing-header wing-a-header">Ala A</div>`;
                if (data.A.length > 0) {
                    data.A.forEach(c => {
                        html += renderCourseCard(c);
                    });
                } else {
                    html += `<div class="empty-slot" onclick="openAddModalPrefilled('${currentDay}','A','${slot}')">+ Ala A</div>`;
                }
                html += `</div>`;

                // Wing B
                html += `<div class="wing-column">`;
                html += `<div class="wing-header wing-b-header">Ala B</div>`;
                if (data.B.length > 0) {
                    data.B.forEach(c => {
                        html += renderCourseCard(c);
                    });
                } else {
                    html += `<div class="empty-slot" onclick="openAddModalPrefilled('${currentDay}','B','${slot}')">+ Ala B</div>`;
                }
                html += `</div>`;

                html += `</div></div>`;
            });

            container.innerHTML = html;
        }

        function renderCourseCard(course) {
            const wingClass = course.wing === 'A' ? 'wing-a' : 'wing-b';
            return `
                <div class="course-card ${wingClass}" onclick="expandCard('${course.id}')" id="card-${course.id}">
                    <div class="course-name">${course.name} <span class="wing-badge">${course.wing}</span></div>
                    <div class="course-teacher">${course.teacher || ''}</div>
                    <div class="course-room">${course.room || ''} · ${course.startTime}-${course.endTime}</div>
                </div>`;
        }

        function expandCard(courseId) {
            if (expandedCourseId === courseId) {
                collapseCard();
                return;
            }

            const course = courses.find(c => c.id === courseId);
            if (!course) return;

            expandedCourseId = courseId;
            const panel = document.getElementById('expandedPanel');
            const overlay = document.getElementById('expandedOverlay');

            // Set wing class
            panel.className = `expanded-panel wing-${course.wing.toLowerCase()}`;

            // Title
            document.getElementById('expTitle').textContent = course.name;

            // Details
            let detailsHtml = '';
            detailsHtml += `<div class="detail-row"><span class="icon">👨‍🏫</span><span class="label">Profesor</span><span class="value">${course.teacher || 'No asignado'}</span></div>`;
            detailsHtml += `<div class="detail-row"><span class="icon">📞</span><span class="label">Teléfono</span><span class="value">${course.phone || 'No registrado'}</span></div>`;
            detailsHtml += `<div class="detail-row"><span class="icon">🏫</span><span class="label">Aula</span><span class="value">${course.room || 'No asignada'}</span></div>`;
            detailsHtml += `<div class="detail-row"><span class="icon">🕐</span><span class="label">Horario</span><span class="value">${course.startTime} - ${course.endTime}</span></div>`;
            detailsHtml += `<div class="detail-row"><span class="icon">📅</span><span class="label">Día</span><span class="value">${dayNames[course.day]}</span></div>`;
            detailsHtml += `<div class="detail-row"><span class="icon">🏢</span><span class="label">Ala</span><span class="value">Ala ${course.wing}</span></div>`;
            if (course.notes) {
                detailsHtml += `<div class="detail-row"><span class="icon">📝</span><span class="label">Notas</span><span class="value">${course.notes}</span></div>`;
            }
            document.getElementById('expDetails').innerHTML = detailsHtml;

            // Actions
            let actionsHtml = '';
            actionsHtml += `<button class="action-btn btn-edit" onclick="editCourse('${course.id}')"><span class="btn-icon">✏️</span> Editar</button>`;
            actionsHtml += `<button class="action-btn btn-move" onclick="openMoveModal('${course.id}')"><span class="btn-icon">↕️</span> Mover</button>`;
            actionsHtml += `<button class="action-btn btn-delete" onclick="deleteCourse('${course.id}')"><span class="btn-icon">🗑️</span> Eliminar</button>`;

            if (course.phone) {
                actionsHtml += `<button class="action-btn btn-call" onclick="callPhone('${course.phone}')"><span class="btn-icon">📞</span> Llamar</button>`;
            } else {
                actionsHtml += `<button class="action-btn btn-call" style="opacity:0.4; cursor:not-allowed;"><span class="btn-icon">📞</span> Sin tel.</button>`;
            }

            document.getElementById('expActions').innerHTML = actionsHtml;

            overlay.classList.add('show');
        }

        function collapseCard() {
            expandedCourseId = null;
            document.getElementById('expandedOverlay').classList.remove('show');
        }

        function handleOverlayClick(event) {
            if (event.target === document.getElementById('expandedOverlay')) {
                collapseCard();
            }
        }

        function callPhone(phone) {
            window.location.href = `tel:${phone}`;
        }

        function editCourse(id) {
            collapseCard();
            const course = courses.find(c => c.id === id);
            if (!course) return;

            editingCourseId = id;
            document.getElementById('modalTitle').textContent = '✏️ Editar Curso';
            document.getElementById('courseName').value = course.name;
            document.getElementById('courseTeacher').value = course.teacher || '';
            document.getElementById('coursePhone').value = course.phone || '';
            document.getElementById('courseDay').value = course.day;
            document.getElementById('courseWing').value = course.wing;
            document.getElementById('courseStart').value = course.startTime;
            document.getElementById('courseEnd').value = course.endTime;
            document.getElementById('courseRoom').value = course.room || '';
            document.getElementById('courseNotes').value = course.notes || '';
            document.getElementById('courseModal').classList.add('show');
        }

        function deleteCourse(id) {
            const course = courses.find(c => c.id === id);
            if (!course) return;
            if (confirm(`¿Eliminar "${course.name}"?`)) {
                courses = courses.filter(c => c.id !== id);
                saveData();
                collapseCard();
                renderTabs();
                renderSchedule();
                showToast('Curso eliminado');
            }
        }

        function openMoveModal(id) {
            collapseCard();
            movingCourseId = id;
            const course = courses.find(c => c.id === id);
            if (!course) return;

            document.getElementById('moveCourseName').textContent = `"${course.name}"`;
            document.getElementById('moveDay').value = course.day;
            document.getElementById('moveWing').value = course.wing;
            document.getElementById('moveStart').value = course.startTime;
            document.getElementById('moveEnd').value = course.endTime;
            document.getElementById('moveModal').classList.add('show');
        }

        function closeMoveModal() {
            document.getElementById('moveModal').classList.remove('show');
            movingCourseId = null;
        }

        function confirmMove() {
            if (!movingCourseId) return;
            const course = courses.find(c => c.id === movingCourseId);
            if (!course) return;

            const newDay = document.getElementById('moveDay').value;
            const newWing = document.getElementById('moveWing').value;
            const newStart = document.getElementById('moveStart').value;
            const newEnd = document.getElementById('moveEnd').value;

            if (!newStart || !newEnd) {
                showToast('Completa las horas');
                return;
            }

            course.day = newDay;
            course.wing = newWing;
            course.startTime = newStart;
            course.endTime = newEnd;

            saveData();
            closeMoveModal();
            currentDay = newDay;
            renderTabs();
            renderSchedule();
            showToast('Curso movido correctamente');
        }

        function toggleFab() {
            const menu = document.getElementById('fabMenu');
            const btn = document.getElementById('fabMain');
            menu.classList.toggle('show');
            btn.classList.toggle('active');
        }

        function openAddModal() {
            closeFab();
            editingCourseId = null;
            document.getElementById('modalTitle').textContent = '📚 Agregar Curso';
            document.getElementById('courseName').value = '';
            document.getElementById('courseTeacher').value = '';
            document.getElementById('coursePhone').value = '';
            document.getElementById('courseDay').value = currentDay;
            document.getElementById('courseWing').value = 'A';
            document.getElementById('courseStart').value = '07:00';
            document.getElementById('courseEnd').value = '08:30';
            document.getElementById('courseRoom').value = '';
            document.getElementById('courseNotes').value = '';
            document.getElementById('courseModal').classList.add('show');
        }

        function openAddModalPrefilled(day, wing, time) {
            closeFab();
            editingCourseId = null;
            document.getElementById('modalTitle').textContent = '📚 Agregar Curso';
            document.getElementById('courseName').value = '';
            document.getElementById('courseTeacher').value = '';
            document.getElementById('coursePhone').value = '';
            document.getElementById('courseDay').value = day;
            document.getElementById('courseWing').value = wing;
            document.getElementById('courseStart').value = time;

            const [h, m] = time.split(':').map(Number);
            const endMinutes = h * 60 + m + 90;
            const endH = String(Math.floor(endMinutes / 60)).padStart(2, '0');
            const endM = String(endMinutes % 60).padStart(2, '0');
            document.getElementById('courseEnd').value = `${endH}:${endM}`;

            document.getElementById('courseRoom').value = '';
            document.getElementById('courseNotes').value = '';
            document.getElementById('courseModal').classList.add('show');
        }

        function closeModal() {
            document.getElementById('courseModal').classList.remove('show');
            editingCourseId = null;
        }

        function closeFab() {
            document.getElementById('fabMenu').classList.remove('show');
            document.getElementById('fabMain').classList.remove('active');
        }

        function saveCourse() {
            const name = document.getElementById('courseName').value.trim();
            const teacher = document.getElementById('courseTeacher').value.trim();
            const phone = document.getElementById('coursePhone').value.trim();
            const day = document.getElementById('courseDay').value;
            const wing = document.getElementById('courseWing').value;
            const startTime = document.getElementById('courseStart').value;
            const endTime = document.getElementById('courseEnd').value;
            const room = document.getElementById('courseRoom').value.trim();
            const notes = document.getElementById('courseNotes').value.trim();

            if (!name) { showToast('Ingresa el nombre del curso'); return; }
            if (!startTime || !endTime) { showToast('Ingresa las horas'); return; }
            if (startTime >= endTime) { showToast('La hora fin debe ser mayor'); return; }

            if (editingCourseId) {
                const course = courses.find(c => c.id === editingCourseId);
                Object.assign(course, { name, teacher, phone, day, wing, startTime, endTime, room, notes });
                showToast('Curso actualizado');
            } else {
                courses.push({
                    id: Date.now().toString(),
                    name, teacher, phone, day, wing, startTime, endTime, room, notes
                });
                showToast('Curso agregado');
            }

            saveData();
            closeModal();
            currentDay = day;
            renderTabs();
            renderSchedule();
        }

        function saveData() {
            localStorage.setItem('courses', JSON.stringify(courses));
        }

        function exportData() {
            closeFab();
            const blob = new Blob([JSON.stringify(courses, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `horario_${new Date().toISOString().slice(0, 10)}.json`;
            a.click();
            URL.revokeObjectURL(url);
            showToast('Datos exportados');
        }

        function importData() {
            closeFab();
            document.getElementById('fileInput').click();
        }

        function handleImport(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const data = JSON.parse(e.target.result);
                    if (Array.isArray(data)) {
                        courses = data;
                        saveData();
                        renderTabs();
                        renderSchedule();
                        showToast(`${data.length} cursos importados`);
                    }
                } catch {
                    showToast('Error al importar');
                }
            };
            reader.readAsText(file);
            event.target.value = '';
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2500);
        }

        init();
    </script>
</body>
</html>
